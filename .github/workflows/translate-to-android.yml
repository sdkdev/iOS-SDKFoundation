name: Translate iOS PR to Android

on:
  pull_request:
    types: [opened]

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout iOS repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ios

      - name: Checkout Android repo
        uses: actions/checkout@v4
        with:
          repository: sdkdev/android-SDKFoundation
          token: ${{ secrets.ANDROID_REPO_TOKEN }}
          path: android

      - name: Get iOS PR diff
        id: diff
        working-directory: ios
        run: |
          git diff origin/${{ github.event.pull_request.base.ref }}...origin/${{ github.event.pull_request.head.ref }} > /tmp/ios-diff.patch
          echo "pr_title=${{ github.event.pull_request.title }}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "branch_name=translate/ios-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Create Android branch
        working-directory: android
        run: |
          git checkout -b translate/ios-pr-${{ github.event.pull_request.number }}

      - name: Read existing Android sources
        id: android_sources
        run: |
          # Collect current Android source files so ChatGPT has full context
          android_src=""
          for f in $(find android/sdkfoundation/src -name '*.kt' 2>/dev/null); do
            android_src="$android_src\n--- $f ---\n$(cat "$f")\n"
          done
          echo "$android_src" > /tmp/android-sources.txt

      - name: Translate with ChatGPT
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          IOS_DIFF=$(cat /tmp/ios-diff.patch)
          ANDROID_SOURCES=$(cat /tmp/android-sources.txt)

          # Build the JSON payload
          jq -n \
            --arg diff "$IOS_DIFF" \
            --arg sources "$ANDROID_SOURCES" \
            --arg title "${{ github.event.pull_request.title }}" \
            --arg body "${{ github.event.pull_request.body }}" \
            '{
              model: "gpt5.4",
              temperature: 0,
              response_format: { type: "json_object" },
              messages: [
                {
                  role: "system",
                  content: "You translate iOS (Swift) code changes to Android (Kotlin). You receive a git diff from an iOS Swift project and the current Android Kotlin source files. Return a JSON object where each key is a file path relative to the android/ directory and each value is the full updated file content.\n\nTranslation rules:\n- Swift `struct: Codable` → Kotlin `@Serializable data class`\n- Swift `let` properties → Kotlin `val` properties\n- Swift `import Foundation` → Kotlin `import kotlinx.serialization.Serializable`\n- Swift Testing `@Test func` → Kotlin JUnit `@Test fun`\n- Swift `#expect(x == y)` → Kotlin `assertEquals(y, x)`\n- iOS source files in Sources/SDKFoundation/ → Android sources in sdkfoundation/src/main/java/com/sdkfoundation/\n- iOS test files in Tests/SDKFoundationTests/ → Android tests in sdkfoundation/src/test/java/com/sdkfoundation/\n- All Kotlin files must have `package com.sdkfoundation` at the top\n- Preserve the same file names (but use .kt extension instead of .swift)\n\nOnly include files that need to be created or modified. Return valid JSON only."
                },
                {
                  role: "user",
                  content: ("iOS PR: \"" + $title + "\"\nDescription: " + $body + "\n\n--- iOS Diff ---\n" + $diff + "\n\n--- Current Android Sources ---\n" + $sources)
                }
              ]
            }' > /tmp/openai-request.json

          # Call OpenAI API
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d @/tmp/openai-request.json)

          # Extract the content from the response
          echo "$RESPONSE" | jq -r '.choices[0].message.content' > /tmp/openai-result.json

          # Check for errors
          if echo "$RESPONSE" | jq -e '.error' > /dev/null 2>&1; then
            echo "OpenAI API error:"
            echo "$RESPONSE" | jq '.error'
            exit 1
          fi

          # Write each file from the JSON response
          for filepath in $(jq -r 'keys[]' /tmp/openai-result.json); do
            dir=$(dirname "android/$filepath")
            mkdir -p "$dir"
            jq -r --arg key "$filepath" '.[$key]' /tmp/openai-result.json > "android/$filepath"
            echo "Wrote: android/$filepath"
          done

      - name: Push Android branch and create PR
        working-directory: android
        env:
          GH_TOKEN: ${{ secrets.ANDROID_REPO_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add -A
          git commit -m "$(cat <<EOF
          Translate iOS PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}

          Automated translation from sdkdev/iOS-SDKFoundation#${{ github.event.pull_request.number }}

          Co-Authored-By: ChatGPT <noreply@openai.com>
          EOF
          )"

          git push -u origin translate/ios-pr-${{ github.event.pull_request.number }}

          gh pr create \
            --repo sdkdev/android-SDKFoundation \
            --title "Translate iOS PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}" \
            --body "$(cat <<EOF
          ## Summary

          Automated translation of iOS changes from sdkdev/iOS-SDKFoundation#${{ github.event.pull_request.number }}.

          **Original iOS PR:** ${{ github.event.pull_request.html_url }}

          ## What was translated

          ${{ github.event.pull_request.body }}

          ---
          🤖 Generated by ChatGPT via GitHub Actions
          EOF
          )"
