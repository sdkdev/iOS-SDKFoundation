name: Translate iOS PR to Android

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to translate"
        required: true
        type: number

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Resolve PR details
        id: pr
        env:
          GH_TOKEN: ${{ secrets.ANDROID_REPO_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER=${{ inputs.pr_number }}
          else
            PR_NUMBER=${{ github.event.pull_request.number }}
          fi

          PR_JSON=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER})
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "title=$(echo "$PR_JSON" | jq -r '.title')" >> "$GITHUB_OUTPUT"
          echo "html_url=$(echo "$PR_JSON" | jq -r '.html_url')" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(echo "$PR_JSON" | jq -r '.base.ref')" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(echo "$PR_JSON" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"
          echo "$PR_JSON" | jq -r '.body // ""' > /tmp/pr-body.txt

      - name: Checkout iOS repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ios

      - name: Checkout Android repo
        uses: actions/checkout@v4
        with:
          repository: sdkdev/android-SDKFoundation
          token: ${{ secrets.ANDROID_REPO_TOKEN }}
          path: android

      - name: Get iOS PR diff
        working-directory: ios
        run: |
          git diff origin/${{ steps.pr.outputs.base_ref }}...origin/${{ steps.pr.outputs.head_ref }} > /tmp/ios-diff.patch

      - name: Create Android branch
        working-directory: android
        run: |
          git checkout -b translate/ios-pr-${{ steps.pr.outputs.number }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Translate with Copilot CLI
        working-directory: android
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          IOS_DIFF=$(cat /tmp/ios-diff.patch)
          PR_BODY=$(cat /tmp/pr-body.txt)

          cat > /tmp/translate-prompt.txt <<'PROMPT'
          You are translating iOS (Swift) changes to Android (Kotlin).

          Translation rules:
          - Swift struct: Codable -> Kotlin @Serializable data class
          - Swift let properties -> Kotlin val properties
          - Swift import Foundation -> Kotlin import kotlinx.serialization.Serializable
          - Swift Testing @Test func -> Kotlin JUnit @Test fun
          - Swift #expect(x == y) -> Kotlin assertEquals(y, x)
          - iOS source files in Sources/SDKFoundation/ -> Android sources in sdkfoundation/src/main/java/com/sdkfoundation/
          - iOS test files in Tests/SDKFoundationTests/ -> Android tests in sdkfoundation/src/test/java/com/sdkfoundation/
          - All Kotlin files must have package com.sdkfoundation at the top
          - Preserve the same file names but use .kt extension instead of .swift

          Apply the equivalent changes to this Android project. Create or modify the necessary Kotlin files.
          PROMPT

          {
            echo ""
            echo "iOS PR title: ${{ steps.pr.outputs.title }}"
            echo "iOS PR description: ${PR_BODY}"
            echo ""
            echo "iOS diff:"
            echo "${IOS_DIFF}"
          } >> /tmp/translate-prompt.txt

          copilot -p "$(cat /tmp/translate-prompt.txt)" \
            --allow-tool='write,read,shell(find:*),shell(cat:*)'

      - name: Push Android branch and create PR
        working-directory: android
        env:
          GH_TOKEN: ${{ secrets.ANDROID_REPO_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          PR_BODY=$(cat /tmp/pr-body.txt)

          git add -A
          git commit -m "$(cat <<EOF
          Translate iOS PR #${{ steps.pr.outputs.number }}: ${{ steps.pr.outputs.title }}

          Automated translation from sdkdev/iOS-SDKFoundation#${{ steps.pr.outputs.number }}

          Co-Authored-By: GitHub Copilot <noreply@github.com>
          EOF
          )"

          git push --force -u origin translate/ios-pr-${{ steps.pr.outputs.number }}

          EXISTING_PR=$(gh pr list \
            --repo sdkdev/android-SDKFoundation \
            --head translate/ios-pr-${{ steps.pr.outputs.number }} \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "Android PR #${EXISTING_PR} already exists, updated via force push."
          else
            gh pr create \
              --repo sdkdev/android-SDKFoundation \
              --title "Translate iOS PR #${{ steps.pr.outputs.number }}: ${{ steps.pr.outputs.title }}" \
              --body "$(cat <<EOF
          ## Summary

          Automated translation of iOS changes from sdkdev/iOS-SDKFoundation#${{ steps.pr.outputs.number }}.

          **Original iOS PR:** ${{ steps.pr.outputs.html_url }}

          ## What was translated

          ${PR_BODY}

          ---
          🤖 Generated by GitHub Copilot via GitHub Actions
          EOF
          )"
          fi
