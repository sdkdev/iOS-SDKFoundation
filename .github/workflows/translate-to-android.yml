name: Translate iOS PR to Android

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to translate"
        required: true
        type: number

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Resolve PR details
        id: pr
        env:
          GH_TOKEN: ${{ secrets.ANDROID_REPO_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER=${{ inputs.pr_number }}
          else
            PR_NUMBER=${{ github.event.pull_request.number }}
          fi

          PR_JSON=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER})
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "title=$(echo "$PR_JSON" | jq -r '.title')" >> "$GITHUB_OUTPUT"
          echo "body=$(echo "$PR_JSON" | jq -r '.body // ""' | head -c 500)" >> "$GITHUB_OUTPUT"
          echo "html_url=$(echo "$PR_JSON" | jq -r '.html_url')" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(echo "$PR_JSON" | jq -r '.base.ref')" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(echo "$PR_JSON" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"

      - name: Checkout iOS repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ios

      - name: Checkout Android repo
        uses: actions/checkout@v4
        with:
          repository: sdkdev/android-SDKFoundation
          token: ${{ secrets.ANDROID_REPO_TOKEN }}
          path: android

      - name: Get iOS PR diff
        working-directory: ios
        run: |
          git diff origin/${{ steps.pr.outputs.base_ref }}...origin/${{ steps.pr.outputs.head_ref }} > /tmp/ios-diff.patch

      - name: Create Android branch
        working-directory: android
        run: |
          git checkout -b translate/ios-pr-${{ steps.pr.outputs.number }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Translate with Copilot CLI
        working-directory: android
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          IOS_DIFF=$(cat /tmp/ios-diff.patch)

